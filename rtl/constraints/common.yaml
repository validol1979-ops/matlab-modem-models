# Shared timing specification for both FPGA vendors.
clock:
  port: clk
  frequency_mhz: 100
  uncertainty_ns: 0.2
io:
  output_load_pf: 5.0
  input_delay_ns: 1.0
  output_delay_ns: 1.0
targets:
  xilinx: xc7a35tcpg236-1
  altera: 5CSEMA5F31C6
acceptance:
  setup_slack_ns: 0.0
  hold_slack_ns: 0.0
  altera_setup_margin_ns: 1.0
